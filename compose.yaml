services:
  homelab-index:
    build:
      context: .
    image: homelab-index:local
    container_name: homelab-index
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config/hosts.json:/app/config/hosts.json:ro
      - ./k3s.config:/app/k3s.config:ro
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
